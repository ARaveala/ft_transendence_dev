<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-gray-800">

  <!-- Paddles. The sizes can be anything, they will be set to users settings -->
  <div id="paddle1" class="bg-blue-500 absolute"></div>
  <div id="paddle2" class="bg-red-500 absolute"></div>

  <!-- Ball -->
  <div id="ball" class="bg-green-500 rounded-full absolute"></div>

  <!-- Game End Prompt -->
  <div id="endPrompt" class="hidden flex flex-col items-center justify-center min-h-screen">
    <div id="endPromptText" class="text-red-500"></div>
    <div id="endPromptButton" class="text-blue-500" onclick="endFunction()">OK</div>
  </div>

  <script src="script.js"></script>

</body>
</html>
