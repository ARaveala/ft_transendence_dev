<!DOCTYPE html>
<html>
<body>
<script>
(async () => {

  console.log("Test harness loaded");

  window.addEventListener("load", () => {
    console.log("Window loaded");
  });
// for remote play a seperate harness would need to repeate steps 
// file does not use yet shared api-protocols , this change should be made .
  try {
	// 1. Login to get cookie change to register to make it work without front end login seperatley
	await fetch('http://localhost:3000/api/login', {
	  method: 'POST',
	  headers: { 'Content-Type': 'application/json' },
	  body: JSON.stringify({ username: 'dev1', password: 'password' }),
	  credentials: 'include' // important: tells fetch to store cookies
	});
    // 2. Create game
    let res = await fetch('http://localhost:3000/api/create-game', { 
	  method: 'POST', 
	  body: JSON.stringify({type: 'local', mode: 'vs'}),
	  credentials: 'include' // important: tells fetch to store cookies  	
	});
	let { gameId } = await res.json();
    console.log('Game created:', gameId);

    // 3. Join as guest
    res = await fetch('http://localhost:3000/api/join-game', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId, type: 'guest', mode: 'local', player_count: 2 }),
	  credentials: 'include' // important: tells fetch to store cookies  
	});
    console.log('Join response:', await res.json());

    // 4. Start game
    res = await fetch('http://localhost:3000/api/start-game', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gameId }),
	  credentials: 'include' // important: tells fetch to store cookies  
	});

    const startData = await res.json();
    console.log("player 1 and 2 tokens", startData.playerTokens);
	console.log('Start response:', startData);
	console.log('Full startData:', JSON.stringify(startData, null, 2));

	console.log('------------------------------------------------------')
    // 5. Redirect to real game client
	// if remote play , check data if game type is remote , then send player2 seperatley so they
	// can establish their own webscoket connection
	setTimeout(() => {
  window.location.href = `/pong_game/index.html?gameId=${gameId}&player1Token=${startData.playerTokens['player1']}&player2Token=${startData.playerTokens['player2']}`;
}, 1000); // 100ms is usually enough
//	window.location.href = `pong_game/index.html?gameId=${gameId}&player1Token=${startData.playerTokens['player1']}&player2Token=${startData.playerTokens['player2']}`;

//    window.location.href = `pong_game/index.html?gameId=${gameId}&token=${startData.playerTokens['player1']}`;


} catch (err) {
    console.error(err);
  }
})();
</script>
</body>
</html>
