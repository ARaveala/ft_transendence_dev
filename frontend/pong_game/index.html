<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-gray-800">

  <!-- Paddles. The sizes can be anything, they will be set to users settings -->
  <div id="paddle1" class="bg-blue-500 absolute"></div>
  <div id="paddle2" class="bg-red-500 absolute"></div>

  <!-- Ball -->
  <div id="ball" class="bg-green-500 rounded-full absolute"></div>

  <!-- Powerup elements will live inside this -->
  <div id="powerup-container" class="relative w-full h-full"></div>

  <!-- Scoreboard -->
  <div id="scoreboard" class="font-mono -translate-x-1/2 fixed top-0 left-1/2 flex space-x-8 text-5xl">
    <div id="p1Score" class="text-blue-500">0</div>
    <div id="p2Score" class="text-red-500">0</div>
  </div>

  <!-- Countdown -->
  <div id="countdown" class="text-green-500 font-mono fixed inset-0 flex items-center justify-center text-9xl"></div>

  <!-- Game End Prompt -->
  <div id="endPrompt" class="hidden fixed inset-0 flex flex-col items-center justify-center min-h-screen">
    <div class="bg-gray-666 border-4 border-gray-800 p-6 rounded-lg text-center">
      <div id="endPromptText" class="font-mono text-2xl"></div>
      <div id="endPromptButton" class="border-2 border-green-500 text-green-500 px-6 py-2 rounded-lg cursor-pointer hover:bg-green-500 hover:text-white transition-colors" onclick="endFunction()">OK</div>
    </div>
  </div>

   <script type="module" src="script.js"></script>

</body>
</html>
