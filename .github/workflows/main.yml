name: Fullstack CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  fullstack-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Backend
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Run npm start
        run: npm start
        working-directory: backend

      # Frontend
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Run npm run dev
        run: npm run dev
        working-directory: frontend

