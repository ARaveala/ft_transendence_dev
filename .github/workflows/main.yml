name: Fullstack CI

on:
  pull_request:
    branches: ["**"]

jobs:
  fullstack-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # --- Install dependencies ---
      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Install tester dependencies
        run: npm install --prefix tester

      # --- Build frontend ---
      - name: Build frontend
        run: npm run build --prefix frontend

      # Optional: If backend serves built frontend, copy it over
      - name: Copy frontend build to backend (if needed)
        run: cp -r frontend/dist backend/public || true

      # --- Run backend + Playwright tests ---
      - name: Start backend and frontend and run Playwright tests
        run: |
          set -e

          # Start backend
          npm start --prefix backend &
          BACKEND_PID=$!

          # Start frontend (Vite dev server)
          npm run dev --prefix frontend &
          FRONTEND_PID=$!

          echo "Waiting for backend and frontend to be ready..."
          npx wait-on http://localhost:3000 http://localhost:5173

          echo "Running API health check..."
          curl -f http://localhost:3000/status || (kill $BACKEND_PID $FRONTEND_PID && exit 1)

          echo "Installing Playwright browsers..."
          npx --prefix tester playwright install --with-deps

          echo "Running Playwright tests..."
          npx --prefix tester playwright test || (kill $BACKEND_PID $FRONTEND_PID && exit 1)

          echo "Shutting down servers..."
          kill $BACKEND_PID $FRONTEND_PID

