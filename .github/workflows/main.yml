name: Fullstack CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  fullstack-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Backend
      - name: Install backend dependencies
        run: npm install -g concurrently
        working-directory: backend

      - name: Run fullstack
        run: concurrently "npm start --prefix backend" "npm run dev --prefix frontend"

