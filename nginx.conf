# User and worker settings
user  nginx;
worker_processes  1;

# Logging settings
error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

# Load modular configuration files
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;

    # Server configuration for frontend and backend
    server {
        listen 80;

        # Serve the frontend
        root /usr/share/nginx/html;
        index index.html;

        server_name _;

        # Frontend location
        location / {
            try_files $uri $uri/ =404;
        }

        # Reverse proxy for backend API
        location /api/ {
            proxy_pass http://backend:3000; # Ensure 'backend' matches your service name in docker-compose
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Optionally, you can add another server block for SSL (https), but that's for more advanced setups
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #     ssl_certificate /etc/nginx/ssl/yourdomain.com.crt;
    #     ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;
    #     include /etc/nginx/conf.d/ssl.conf;
    # }
}

