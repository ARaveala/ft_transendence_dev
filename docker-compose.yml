version: "3.8"
name: transcendence

services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /data/database.sqlite
    ports:
      - "3000:3000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=http://backend:3000
    depends_on:
      - backend
    ports:
    - "8080:80" 
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:

volumes:
  backend_data:
