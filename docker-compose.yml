
services:


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend_data:/data
    ports:
      - "3001:3000"  # Expose backend API port
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - BROWSER=none
    ports:
      - "5173:5173"
    networks:
      - app-net

networks:
  app-net:

volumes:
  backend_data:

