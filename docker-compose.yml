
services:
  certgen:
    container_name: certgen
    image: alpine:3.22
    command: >
      sh -c 'apk add --no-cache openssl && mkdir -p /out &&
             [ -f /out/fullchain.pem ] || openssl req -x509 -nodes -newkey rsa:2048 -keyout /out/privkey.pem -out /out/fullchain.pem -days 365 -subj "/CN=localhost"'
    volumes:
      - ./volumes/tls:/out
  waf:
    container_name: modsecurity
    build:
      context: ./modsec
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
      - frontend
      - certgen
    volumes:
    - ./volumes/nginx_logs:/var/log/nginx
    - ./volumes/tls:/etc/ssl/local
    ports:
    - "80:80"
    - "443:443"
    networks:
      - app-net
    # Optional: mark proxy itself healthy (hits its own https listener)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  vault:
    container_name: vault
    build:
      context: ./vault
      dockerfile: Dockerfile
    environment:
      VAULT_DEV_ROOT_TOKEN: myroot
    volumes:
      - ./volumes/backend_secrets:/run/secrets
    networks:
      - app-net
    # restart: unless-stopped

  backend:
    container_name: backend
    depends_on:
      - vault
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./volumes/backend_data:/app/data
      - ./volumes/backend_secrets:/run/secrets
    expose:
    - "3000" # Expose backend API port
    networks:
      - app-net
    # healthcheck:
    #   # bookworm-slim: install curl in the Dockerfile (see below)
    #   test: ["CMD-SHELL", "curl -fsk http://localhost:3000/ >/dev/null || exit 1"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 10
    #   start_period: 20s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - BROWSER=none
    expose:
      - "5173"
    networks:
      - app-net
    # healthcheck:
    #   # node:20-alpine has BusyBox wget
    #   test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 10
    #   start_period: 20s

networks:
  app-net:


