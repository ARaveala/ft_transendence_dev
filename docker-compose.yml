
services:


  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend_volume:/app/data
    ports:
      - "3001:3000"  # Expose backend API port
    networks:
      - app-net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - BROWSER=none
    ports:
      - "5173:5173"
    networks:
      - app-net

networks:
  app-net:


