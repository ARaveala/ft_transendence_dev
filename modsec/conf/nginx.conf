

worker_processes 2;

error_log /var/log/nginx/error_log info;

load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
  server {
    listen 80;
    return 301 https://$host:4004$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/local/fullchain.pem;
    ssl_certificate_key /etc/ssl/local/privkey.pem;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Frontend - proxying frontend traffic to Vite
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://frontend:5173;
    }

    # Backend API - proxying backend API traffic
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://backend:3000;
    }

    # WebSocket Proxying - handle WebSocket traffic for Vite's HMR
    location /wss {  # Make sure there is no trailing slash
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_pass http://backend:3000/wss;  # Ensure backend listens at /wss
    }

    # Health check endpoint
    location /health {
      access_log off;
      return 200 'OK';
      add_header Content-Type text/plain;
    }
  }
}

